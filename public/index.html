<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080d10" />
  <title>渊塔守卫 · 肉鸽塔防</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/auth.css" />
</head>
<body>
  <main id="app">
    <section id="title-screen" class="screen title-screen" aria-label="标题页">
      <div class="title-glow" aria-hidden="true"></div>
      <div class="title-inner">
        <p class="logo-kicker" data-i18n="title.kicker">ROGUELIKE TOWER DEFENSE</p>
        <h1 data-i18n="title.name">渊塔守卫</h1>
        <p class="logo-sub" data-i18n="title.tagline">在深渊吞没基地之前，守住最后三十波。</p>

        <div class="title-card">
          <div class="profile-line">
            <span id="player-name" class="player-name" data-i18n="title.commander">指挥官</span>
            <button id="btn-rename" class="icon-btn" type="button" title="修改昵称" data-i18n-title="title.rename" data-i18n-aria="title.rename"><span data-icon="rename" aria-hidden="true"></span></button>
            <button id="btn-settings-title" class="icon-btn" type="button" title="画质设置" data-i18n-title="title.settings" data-i18n-aria="title.settings"><span data-icon="settings" aria-hidden="true"></span></button>
            <span class="cores-badge" aria-label="星核数量"><span data-icon="cores" aria-hidden="true"></span> <b id="cores">0</b></span>
          </div>

          <nav class="title-actions" aria-label="主菜单">
            <button id="btn-play" class="btn primary big" type="button" data-i18n="title.play">开始远征</button>
            <button id="btn-daily" class="btn ghost" type="button"><span data-i18n="title.daily">每日挑战</span> <span id="daily-label"></span></button>
            <button id="btn-endless" class="btn ghost" type="button"><span data-i18n="title.endless">无尽模式</span> <span id="endless-label" data-i18n="title.endless.tag">30 波后继续挑战</span></button>
            <button id="btn-resume" class="btn ghost" type="button" data-i18n="title.resume" hidden>继续上一局</button>
            <div class="row" role="group" aria-label="更多功能">
              <button id="btn-shop" class="btn small" type="button" data-i18n="title.shop">星核商店</button>
              <button id="btn-board" class="btn small" type="button" data-i18n="title.board">排行榜</button>
              <button id="btn-daily-history" class="btn small" type="button">每日历史</button>
              <button id="btn-achievements" class="btn small" type="button" data-i18n="title.achievements">成就</button>
              <button id="btn-cosmetics" class="btn small" type="button">称号</button>
              <button id="btn-stats" class="btn small" type="button" data-i18n="title.stats">生涯</button>
              <button id="btn-season" class="btn small" type="button" data-i18n="title.season">赛季</button>
              <button id="btn-relic-codex" class="btn small" type="button" data-i18n="title.relicCodex">遗物图鉴</button>
              <button id="btn-share" class="btn small" type="button">分享码</button>
              <button id="btn-help" class="btn small" type="button" data-i18n="title.help">玩法</button>
            </div>
          </nav>

          <div id="title-skills" class="skill-cards"></div>

          <div id="title-stats" class="title-stats" aria-label="生涯概览"></div>

          <div id="achievements-panel" class="achievements-panel" hidden>
            <div class="achievements-head">
              <h2 data-i18n="title.achievements">成就</h2>
              <span id="achievements-progress" class="achievements-progress">0 / 0</span>
              <button id="btn-achievements-close" class="icon-btn" type="button" title="关闭成就面板" data-i18n-title="title.closeAchievements" data-i18n-aria="title.closeAchievements"><span data-icon="close" aria-hidden="true"></span></button>
            </div>
            <div id="achievements-list" class="achievements-list"></div>
          </div>

          <div id="cosmetics-panel" class="achievements-panel cosmetics-panel" hidden>
            <div class="achievements-head">
              <h2>称号与头像框</h2>
              <button id="btn-cosmetics-close" class="icon-btn" type="button" title="关闭外观面板" aria-label="关闭外观面板"><span data-icon="close" aria-hidden="true"></span></button>
            </div>
            <div id="cosmetics-body" class="cosmetics-body"></div>
          </div>

          <div id="stats-panel" class="career-panel" hidden>
            <div class="career-head">
              <h2 data-i18n="title.stats">生涯</h2>
              <button id="btn-stats-close" class="icon-btn" type="button" title="关闭生涯面板" data-i18n-title="title.closeStats" data-i18n-aria="title.closeStats"><span data-icon="close" aria-hidden="true"></span></button>
            </div>
            <div id="stats-body" class="career-body"></div>
          </div>

          <div id="season-panel" class="season-panel" hidden></div>

          <div id="relic-codex-panel" class="relic-codex-panel" hidden></div>

          <div id="share-panel" class="share-panel" hidden></div>

          <div id="leaderboard-panel" hidden></div>
          <div id="daily-history-panel" hidden></div>
        </div>

        <p class="footnote" data-i18n="title.footnote">服务端生成地图 / 波次 / 遗物 · 每波自动存档</p>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen" aria-label="战场" hidden>
      <header class="hud" aria-label="状态栏">
        <div class="hud-left" role="group" aria-label="战况">
          <div class="stat"><span class="stat-label" data-i18n="hud.wave">波次</span><b id="hud-wave">0</b><span class="stat-max">/30</span></div>
          <div class="stat gold"><span class="stat-label" data-i18n="hud.gold">金币</span><b id="hud-gold">0</b></div>
          <div class="stat hp"><span class="stat-label" data-i18n="hud.base">基地</span><b id="hud-hp">20</b><span class="stat-max" id="hud-hpmax">/20</span></div>
          <div class="stat"><span class="stat-label" data-i18n="hud.kills">击杀</span><b id="hud-kills">0</b></div>
        </div>
        <div class="hud-right" role="group" aria-label="控制">
          <div id="hud-difficulty" class="diff-badge" data-i18n="hud.defaultDifficulty">远征</div>
          <div id="wave-state" class="wave-state" data-i18n="hud.prep" role="status" aria-live="polite">准备阶段</div>
          <button id="btn-next-wave" class="btn primary" type="button" data-i18n="hud.startWave1">开始第 1 波</button>
          <div class="speed-group" role="group" aria-label="游戏速度" data-i18n-aria="hud.speedGroup">
            <button class="speed-btn" type="button" data-speed="0" title="暂停 / 继续" data-i18n-title="hud.pauseResume" data-i18n-aria="hud.pauseResume"><span data-icon="pause" aria-hidden="true"></span></button>
            <button class="speed-btn active" type="button" data-speed="1" aria-label="1 倍速">1×</button>
            <button class="speed-btn" type="button" data-speed="2" aria-label="2 倍速">2×</button>
            <button class="speed-btn" type="button" data-speed="3" aria-label="3 倍速">3×</button>
          </div>
          <button id="btn-relics-mobile" class="icon-btn mobile-only" type="button" title="查看遗物" data-i18n-title="hud.viewRelics" data-i18n-aria="hud.viewRelics"><span data-icon="cores" aria-hidden="true"></span><span id="hud-relics">0</span></button>
          <button id="btn-fullscreen" class="icon-btn mobile-only" type="button" title="全屏 / 横屏" data-i18n-title="hud.fullscreen" data-i18n-aria="hud.fullscreen"><span data-icon="fullscreen" aria-hidden="true"></span></button>
          <button id="btn-settings-game" class="icon-btn" type="button" title="画质设置" data-i18n-title="hud.settings" data-i18n-aria="hud.settings"><span data-icon="settings" aria-hidden="true"></span></button>
          <button id="btn-sound" class="icon-btn" type="button" title="音效" data-i18n-title="hud.sound" data-i18n-aria="hud.sound"><span data-icon="sound" aria-hidden="true"></span></button>
          <button id="btn-quit" class="icon-btn" type="button" title="退出远征" data-i18n-title="hud.quit" data-i18n-aria="hud.quit"><span data-icon="close" aria-hidden="true"></span></button>
        </div>
      </header>

      <div class="stage-wrap">
        <div class="stage">
          <canvas id="game-canvas" width="1056" height="576" aria-label="游戏战场"></canvas>

          <aside class="relic-panel" aria-label="遗物与下一波情报">
            <div class="relic-title"><span data-i18n="hud.relics">遗物</span> <span id="relic-count">0</span></div>
            <div id="relic-list" class="relic-list"></div>
            <div id="next-wave-panel" class="next-wave-panel" hidden>
              <div class="relic-title"><span data-i18n="hud.nextWave">下一波</span> <span id="next-wave-meta"></span></div>
              <div id="next-wave-list" class="next-wave-list"></div>
            </div>
          </aside>

          <div id="tower-panel" class="tower-panel" role="region" aria-label="塔详情" hidden></div>

          <!-- 主动技能：右下角圆形按钮，冷却径向 + Q 提示；无技能旧局隐藏。 -->
          <button id="btn-skill" class="btn-skill" type="button" hidden aria-label="释放主动技能" title="主动技能（Q）">
            <span id="skill-cd" class="skill-cd" aria-hidden="true"></span>
            <span class="skill-glyph" data-icon="skill" aria-hidden="true"></span>
            <span id="skill-count" class="skill-count" aria-hidden="true"></span>
            <span class="skill-key" aria-hidden="true">Q</span>
          </button>
          <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
          <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        </div>
      </div>

      <div id="rotate-hint" class="rotate-hint">
        <div class="rotate-card">
          <div class="rotate-icon" data-icon="rotate" aria-hidden="true"></div>
          <h2 data-i18n="rotate.title">正在切换横屏</h2>
          <p data-i18n="rotate.body">游戏需要横屏进行。若浏览器未自动旋转，请关闭系统竖屏锁定后重试。</p>
          <button id="btn-rotate-retry" class="btn primary" type="button" data-i18n="rotate.retry">重试自动横屏</button>
          <p class="rotate-note" data-i18n="rotate.note">iOS Safari 不支持网页强制旋转，请在浏览器菜单中选择横屏。</p>
        </div>
      </div>

      <footer class="shop" aria-label="建造商店">
        <div id="shop-list" class="shop-list" role="group" aria-label="可用塔"></div>
        <div class="shop-hint" data-i18n="shop.hint">选择塔卡 → 点击空地建造 · 快捷键 1–5 · Q 技能 · U 升级 · S 出售 · 空格暂停 · Esc 取消</div>
      </footer>
    </section>

    <div id="modal-root"></div>
  </main>

  <div id="auth-root"></div>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/achievements-ui.js"></script>
  <script type="module" src="/js/cosmetics-ui.js"></script>
  <script type="module" src="/js/stats-ui.js"></script>
  <script type="module" src="/js/leaderboard-ui.js"></script>
  <script type="module" src="/js/season-ui.js"></script>
  <script type="module" src="/js/relic-codex-ui.js"></script>
  <script type="module" src="/js/daily-history-ui.js"></script>
  <script type="module" src="/js/share-ui.js"></script>
</body>
</html>
