name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 静态检查（语法 + 导入图 + 风格 + 文档）
        run: npm run check:static
      - name: 结构预算门禁
        run: node --no-warnings scripts/structure-budget.mjs --check
      - name: 单元与接口测试
        run: npm test
