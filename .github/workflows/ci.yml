name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          for f in $(git ls-files '*.mjs' '*.js'); do
            node --input-type=module --check < "$f" || { echo "语法错误：$f"; exit 1; }
          done
      - name: 单元与接口测试
        run: npm test
